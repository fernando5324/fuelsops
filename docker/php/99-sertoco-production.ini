; ============================================================
; Sertoco - Ajustes de PHP para el contenedor
; ============================================================
; Se carga via /usr/local/etc/php/conf.d, asi que aplica tanto a
; CLI como a mod_php.
;
; La imagen php:8.3-apache NO trae php.ini, por lo que sin este
; archivo PHP corre con sus defaults compilados, que en produccion
; son un problema real:
;   display_errors=On / log_errors=Off -> los notices se IMPRIMEN
;     dentro de la respuesta (rompen el JSON de Inertia) y nada
;     queda registrado en ningun lado.
;   upload_max_filesize=2M / post_max_size=8M -> los limites de la
;     aplicacion son inalcanzables: 10 MB por adjunto
;     (PublicOrderStoreRequest) y 5 MB para el Excel
;     (ImportPricesRequest) los rechazaria PHP antes de que llegue
;     a la validacion de Laravel.
;   memory_limit=128M -> la importacion de precios puede agotar memoria.
;   max_input_vars=1000 -> un pedido con muchas lineas de detalle,
;     compartimentos y adjuntos lo supera.
;   expose_php=On -> filtra la version de PHP en las cabeceras.
; ============================================================

[PHP]

; --- Errores: nunca a la respuesta, siempre a stderr ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
html_errors = Off
expose_php = Off

; --- Locale y zona horaria ---
; APP_TIMEZONE (America/Lima) lo aplica Laravel al arrancar; PHP se
; queda en UTC para que logs y CLI coincidan con la base de datos.
date.timezone = UTC
default_charset = "UTF-8"

; --- $_ENV debe conservar las variables de la plataforma: el helper
;     Env() de Laravel lee $_ENV y $_SERVER. (php.ini-production trae
;     variables_order="GPCS", que vacia $_ENV: no usar ese valor aqui.)
variables_order = "EGPCS"

; --- Subidas de archivos: por encima de los limites de la app ---
; Por archivo 16M (la app permite 10M) | por peticion 32M (varios adjuntos)
upload_max_filesize = 16M
post_max_size = 32M
max_file_uploads = 30
file_uploads = On

; --- Recursos ---
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; --- Sesion: la cookie y el modo los gestiona Laravel, esto solo
;     endurece los valores por defecto del servidor ---
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El codigo de la imagen es inmutable: no hace falta comprobar cada
; archivo en cada peticion. Si algun dia se monta el codigo fuente
; encima de la imagen, volver esto a 1 (si no, se sirve codigo viejo).
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1

[realpath]
; Arbol pequeno y estatico: la cache de realpath evita resolver cada
; include de Laravel en cada peticion.
realpath_cache_size = 4096k
realpath_cache_ttl = 600
