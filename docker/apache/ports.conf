# ============================================================
# Sertoco - Puerto de escucha de Apache
# ============================================================
# Apache expande ${...} desde el entorno del proceso apache2.
# APACHE_PORT lo define el Dockerfile (80 por defecto) y el
# entrypoint lo sobreescribe con la variable PORT que inyecta el
# PaaS (Railway, Render, Fly.io, Cloud Run, Heroku...).
#
# IMPORTANTE: debe coincidir con el <VirtualHost> de
# 000-default.conf, o Apache avisa "VirtualHost *:80 has no
# listening ports" y no levanta.
Listen ${APACHE_PORT}

# El contenedor NO termina TLS (lo hace el proxy del PaaS), asi que
# estos bloques solo aplican si alguien activa mod_ssl a proposito.
<IfModule ssl_module>
    Listen 443
</IfModule>

<IfModule mod_gnutls.c>
    Listen 443
</IfModule>
