# ============================================================
# Sertoco - VirtualHost de la aplicacion
# ============================================================
# El puerto se resuelve con ${APACHE_PORT} (ver ports.conf y
# docker/entrypoint.sh): en un PaaS la variable llega como $PORT y
# cambia en cada despliegue.
<VirtualHost *:${APACHE_PORT}>

    # APACHE_SERVER_NAME lo calcula el entrypoint a partir de APP_URL
    # (si no hay, "localhost"). Evita el aviso "Could not reliably
    # determine the server's fully qualified domain name" y hace que
    # las redirecciones usen el host real.
    ServerName ${APACHE_SERVER_NAME}
    ServerTokens Prod
    ServerSignature Off

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    DirectoryIndex index.php

    # ========================================================
    # Logs
    # ========================================================
    # Un contenedor tiene un sistema de archivos efimero y las
    # plataformas leen stdout/stderr, no ficheros: escribir en
    # ${APACHE_LOG_DIR}/*.log es perder los logs y llenar el disco.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # ========================================================
    # Cabeceras de seguridad (mod_headers viene activo en la imagen)
    # ========================================================
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

</VirtualHost>
