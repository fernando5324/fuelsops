services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sertoco-app

    ports:
      - "8080:80"

    environment:
      APP_NAME: Sertoco
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sertoco
      DB_USERNAME: sertoco
      DB_PASSWORD: sertoco

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - ./storage:/var/www/html/storage

    restart: unless-stopped


  mysql:
    image: mysql:8.4

    container_name: sertoco-mysql

    environment:
      MYSQL_DATABASE: sertoco
      MYSQL_USER: sertoco
      MYSQL_PASSWORD: sertoco
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - sertoco_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped


volumes:
  sertoco_mysql_data: